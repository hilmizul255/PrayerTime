
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=Prayer Times
Author=Hilmi
Information=Malaysian daily prayer times
Version=1.0

[Variables]
; =================================
; CONFIGURATION
; check zone: https://www.e-solat.gov.my/
; =================================
ZoneCode=SGR01

FontFace=Trebuchet MS
FontColor=255,255,255,205
AccentColor=235,170,0,255
MutedColor=255,255,255,205
SubuhColor=#MutedColor#
SyurukColor=#MutedColor#
ZohorColor=#MutedColor#
AsarColor=#MutedColor#
MaghribColor=#MutedColor#
IsyakColor=#MutedColor#

FontSize=8
TitleSize=10

; =================================
; DATE MEASURES
; =================================

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%m

[MeasureYear]
Measure=Time
Format=%Y

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y

; =================================
; API REQUEST
; =================================

[MeasureAPI]
Measure=Plugin
Plugin=WebParser
URL=https://api.waktusolat.app/solat/#ZoneCode#/[&MeasureDay]?year=[&MeasureYear]&month=[&MeasureMonth]
RegExp=(?si)"fajr"\s*:\s*"?([^",}]+)"?.*?"syuruk"\s*:\s*"?([^",}]+)"?.*?"dhuhr"\s*:\s*"?([^",}]+)"?.*?"asr"\s*:\s*"?([^",}]+)"?.*?"maghrib"\s*:\s*"?([^",}]+)"?.*?"isha"\s*:\s*"?([^",}]+)"?
UpdateRate=1800
Download=1
DynamicVariables=1

; =================================
; EXTRACT PRAYER TIMES
; =================================

[MeasureSubuh]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=1
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureSyuruk]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=2
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureZohor]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=3
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureAsar]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=4
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureMaghrib]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=5
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureIsyak]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=6
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"--:--","^(\d\d):(\d\d):\d\d$":"\1:\2"

[MeasureNextPrayer]
Measure=Script
ScriptFile=#@#PrayerTime.lua
UpdateDivider=1
DynamicVariables=1

; =================================
; BACKGROUND
; =================================

[styleTextShadow]
StringEffect=Shadow
FontEffectColor=0,0,0,20

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,260,235,8 | Fill Color 0,0,0,0 | StrokeWidth 0

; =================================
; TITLE
; =================================

[MeterTitle]
Meter=String
MeterStyle=styleTextShadow
X=18
Y=15
FontFace=#FontFace#
FontSize=#TitleSize#
FontColor=#FontColor#
FontWeight=600
FontEffectColor=0,0,0,50
Text=PRAYER TIMES
AntiAlias=1

[MeterZone]
Meter=String
MeterStyle=styleTextShadow
X=240
Y=20
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#AccentColor#
Text=#ZoneCode#
AntiAlias=1


