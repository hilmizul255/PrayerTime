
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Prayer Times
Author=Hilmi
Information=Malaysian daily prayer times
Version=1.0

[Variables]
; =================================
; CONFIGURATION
; =================================
ZoneCode=SGR01

FontFace=Segoe UI
FontColor=255,255,255,255
AccentColor=100,200,180,255
MutedColor=160,160,160,255

FontSize=11
TitleSize=15

; =================================
; DATE MEASURES
; =================================

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%m

[MeasureYear]
Measure=Time
Format=%Y

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y

; =================================
; API REQUEST
; =================================

[MeasureAPI]
Measure=Plugin
Plugin=WebParser
URL=https://api.waktusolat.app/solat/#ZoneCode#/[MeasureDay]?year=[MeasureYear]&month=[MeasureMonth]
RegExp=(?si)"fajr"\s*:\s*"?([^",}]+)"?.*?"syuruk"\s*:\s*"?([^",}]+)"?.*?"dhuhr"\s*:\s*"?([^",}]+)"?.*?"asr"\s*:\s*"?([^",}]+)"?.*?"maghrib"\s*:\s*"?([^",}]+)"?.*?"isha"\s*:\s*"?([^",}]+)"?
UpdateRate=1800
Download=1
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureLua "Update"]

; =================================
; EXTRACT PRAYER TIMES
; =================================

[MeasureSubuh]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=1
DynamicVariables=1

[MeasureSyuruk]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=2
DynamicVariables=1

[MeasureZohor]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=3
DynamicVariables=1

[MeasureAsar]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=4
DynamicVariables=1

[MeasureMaghrib]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=5
DynamicVariables=1

[MeasureIsyak]
Measure=Plugin
Plugin=WebParser
URL=[MeasureAPI]
StringIndex=6
DynamicVariables=1

; =================================
; LUA CONVERSION
; =================================

[MeasureLua]
Measure=Script
ScriptFile=#@#PrayerTime.lua
UpdateDivider=-1

; =================================
; BACKGROUND
; =================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,260,270,12 | Fill Color 25,30,40,235 | StrokeWidth 0

; =================================
; TITLE
; =================================

[MeterTitle]
Meter=String
X=18
Y=15
FontFace=#FontFace#
FontSize=#TitleSize#
FontColor=#FontColor#
FontWeight=600
Text=PRAYER TIMES
AntiAlias=1

[MeterZone]
Meter=String
X=240
Y=20
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#AccentColor#
Text=#ZoneCode#
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=18
Y=43
FontFace=#FontFace#
FontSize=9
FontColor=#MutedColor#
AntiAlias=1

